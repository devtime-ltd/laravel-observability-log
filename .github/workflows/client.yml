name: Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    name: Browser agent

    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run check

      - run: npm test

      # The PHP package inlines the built file, so a stale commit of it
      # would ship silently. Rebuild and diff rather than trust it.
      - name: Inlined build is current
        run: |
          npm run build
          git diff --exit-code ../resources/client.min.js
